services:
  invokeai:
    image: ghcr.io/invoke-ai/invokeai:main-rocm
    container_name: local-ai-invokeai
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ports:
      - "${INVOKEAI_PORT:-9090}:9090"
    environment:
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-11.5.1}
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0}
      INVOKEAI_ROOT: /invokeai
    volumes:
      - ../../data/invokeai:/invokeai
